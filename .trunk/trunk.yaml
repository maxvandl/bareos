# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
lint:
  enabled:
    - trufflehog@3.90.13
    - yamllint@1.38.0
    - shfmt@3.13.1
    - pinact@4.0.0
    - shellcheck@0.11.0
    - renovate@44.155.6
    - prettier@3.9.10
    - markdownlint@0.49.1
    - hadolint@2.15.1
    - checkov@3.3.29
    - git-diff-check
    - actionlint@1.7.12
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
