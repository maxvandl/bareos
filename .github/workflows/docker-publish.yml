---
name: Build, scan and publish images

on:
  push:
    branches: ["main"]
    tags: ["*.*.*"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly rebuild picks up base image and package security updates
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26.04 = latest Ubuntu release (also gets unsuffixed tags), 24.04 = previous LTS
        ubuntu: ["24.04", "26.04"]
        component:
          - name: dir
            context: ./director-pgsql
            platforms: linux/amd64
          - name: sd
            context: ./storage
            platforms: linux/amd64
          - name: fd
            context: ./client
            platforms: linux/amd64
          - name: webui
            context: ./webui
            platforms: linux/amd64,linux/arm64
          - name: api
            context: ./api
            platforms: linux/amd64,linux/arm64
          - name: smtpd
            context: ./smtpd
            platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${OWNER,,}/bareos-${{ matrix.component.name }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Setup QEMU
        if: contains(matrix.component.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-ubuntu${{ matrix.ubuntu }}
            type=ref,event=pr,suffix=-ubuntu${{ matrix.ubuntu }}
            type=semver,pattern={{version}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=semver,pattern={{major}}.{{minor}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=sha,suffix=-ubuntu${{ matrix.ubuntu }}
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=raw,value=ubuntu${{ matrix.ubuntu }},enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ matrix.ubuntu == '26.04' }}
            type=semver,pattern={{version}},enable=${{ matrix.ubuntu == '26.04' }}
            type=raw,value=latest,enable=${{ matrix.ubuntu == '26.04' && github.ref == 'refs/heads/main' }}

      # Build amd64 locally first so the image is scanned before anything is pushed
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.ubuntu }}

      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # 0.34.2
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy-${{ matrix.component.name }}-${{ matrix.ubuntu }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.component.name }}-${{ matrix.ubuntu }}.sarif
          category: trivy-${{ matrix.component.name }}-${{ matrix.ubuntu }}

      - name: Trivy scan (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # 0.34.2
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          skip-setup-trivy: true


  # Start the whole stack from the freshly built images and check that the
  # daemons talk to each other, the web UI accepts a login and mail is relayed
  compose-test:
    needs: build-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create .env
        run: |
          sed -e "s/=changeme/=$(openssl rand -hex 16)/" \
              -e "s/^ADMIN_MAIL=.*/ADMIN_MAIL=ci@example.invalid/" \
              -e "s/^UBUNTU_VERSION=.*/UBUNTU_VERSION=${{ matrix.ubuntu }}/" .env.dist > .env
          mkdir -p data/bareos/config/{director,storage,client,webui} data/bareos/data/{director,storage} data/pgsql

      - name: Build images (from cache)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=dir-${{ matrix.ubuntu }}
            *.cache-from=type=gha,scope=sd-${{ matrix.ubuntu }}
            *.cache-from=type=gha,scope=fd-${{ matrix.ubuntu }}
            *.cache-from=type=gha,scope=webui-${{ matrix.ubuntu }}
            *.cache-from=type=gha,scope=api-${{ matrix.ubuntu }}
            *.cache-from=type=gha,scope=smtpd-${{ matrix.ubuntu }}

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Director reaches storage and file daemon
        run: |
          out=$(printf 'status client=bareos-fd\nstatus storage=File\n' | docker compose exec -T bareos-dir bconsole)
          echo "$out"
          echo "$out" | grep -q 'bareos-fd Version'
          echo "$out" | grep -q 'bareos-sd Version'

      - name: Web UI login
        run: |
          set -a; . ./.env; set +a
          jar="$RUNNER_TEMP/webui.jar"
          csrf=$(curl -fsS -c "$jar" -b "$jar" http://localhost:8080/bareos-webui/auth/login \
            | grep -oE 'name="csrf"[^>]*value="[^"]*"' | grep -oE 'value="[^"]*"' | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" \
            --data-urlencode "csrf=$csrf" --data-urlencode director=localhost-dir \
            --data-urlencode consolename=admin --data-urlencode "password=$BAREOS_WEBUI_PASSWORD" \
            --data 'locale=en_EN&bareos_updates=&submit=Login' http://localhost:8080/bareos-webui/auth/login)
          test "$code" = 302

      - name: Web UI dashboard
        env:
          jar: ${{ runner.temp }}/webui.jar
        run: |
          # without a session the dashboard redirects to the login page
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/bareos-webui/dashboard/)
          test "$anon" = 302
          # with the session from the login step it renders
          code=$(curl -s -o dashboard.html -w '%{http_code}' -b "$jar" http://localhost:8080/bareos-webui/dashboard/)
          test "$code" = 200
          grep -qi 'dashboard' dashboard.html
          ! grep -qi 'auth/login' dashboard.html || { echo "dashboard redirected to login"; exit 1; }

      - name: Secrets are not in the daemon environment
        run: |
          # the entrypoint execs the daemon, so it is PID 1; --privileged is needed only
          # for CAP_SYS_PTRACE, cap_drop ALL keeps even root in the container out of /proc/1/environ
          for svc in bareos-dir bareos-sd bareos-fd smtpd; do
            echo "== $svc"
            if docker compose exec --privileged -T "$svc" sh -c "tr '\\0' '\\n' </proc/1/environ" | grep -E '(PASSWORD|PGUSER)=.+'; then
              echo "secret found in $svc environment"; exit 1
            fi
          done

      - name: Catalog backup job
        run: |
          out=$(printf 'run job=BackupCatalog yes\nwait\nmessages\n' | docker compose exec -T bareos-dir bconsole)
          echo "$out"
          echo "$out" | grep -q 'Termination:.*Backup OK'

      - name: Mail was handed to the relay
        run: docker compose logs smtpd | grep -qE 'from=<.*ci@example.invalid|status=(sent|deferred|bounced)'

      - name: Logs on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail=100

  publish:
    needs: compose-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26.04 = latest Ubuntu release (also gets unsuffixed tags), 24.04 = previous LTS
        ubuntu: ["24.04", "26.04"]
        component:
          - name: dir
            context: ./director-pgsql
            platforms: linux/amd64
          - name: sd
            context: ./storage
            platforms: linux/amd64
          - name: fd
            context: ./client
            platforms: linux/amd64
          - name: webui
            context: ./webui
            platforms: linux/amd64,linux/arm64
          - name: api
            context: ./api
            platforms: linux/amd64,linux/arm64
          - name: smtpd
            context: ./smtpd
            platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${OWNER,,}/bareos-${{ matrix.component.name }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Setup QEMU
        if: contains(matrix.component.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-ubuntu${{ matrix.ubuntu }}
            type=ref,event=pr,suffix=-ubuntu${{ matrix.ubuntu }}
            type=semver,pattern={{version}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=semver,pattern={{major}}.{{minor}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=sha,suffix=-ubuntu${{ matrix.ubuntu }}
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}},suffix=-ubuntu${{ matrix.ubuntu }}
            type=raw,value=ubuntu${{ matrix.ubuntu }},enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ matrix.ubuntu == '26.04' }}
            type=semver,pattern={{version}},enable=${{ matrix.ubuntu == '26.04' }}
            type=raw,value=latest,enable=${{ matrix.ubuntu == '26.04' && github.ref == 'refs/heads/main' }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.component.context }}
          platforms: ${{ matrix.component.platforms }}
          push: true
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}-${{ matrix.ubuntu }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
